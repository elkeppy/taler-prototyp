var WARUM_ROLLEN={

 html:'<p><b>Sechs Rollen decken je genau ein Grundbedürfnis, das jeder Mensch hat (Essen, Wasser, Dach, Kleidung, Wärme, Gesundheit), der Schmied liefert das Werkzeug für alle. Das ist bewusst vereinfacht, aber an echten Dörfern des Mittelalters orientiert.</b></p>'+
 '<p>Was ein Mensch zuerst zum Leben braucht, haben Psychologen und Ökonomen ähnlich beschrieben. Abraham Maslow ({F:maslow.jahr}) nennt als Basis Hunger, Durst und Körperwärme, danach Schutz und Sicherheit. Manfred Max-Neef zählt Nahrung und Obdach zur „Subsistenz“ und Heilen zum „Schutz“. Daraus folgt unser Dorf: <b>Bauer</b> (Essen), <b>Brunnenbauer</b> (Wasser), <b>Zimmermann</b> (Dach), <b>Weber</b> (Kleidung), <b>Köhler</b> (Wärme und Brennstoff), <b>Heilerin</b> (Gesundheit). Der <b>Schmied</b> deckt kein Bedürfnis direkt, er macht aber Pflug, Axt und Nadel für alle anderen. Gerichtsakten eines englischen Dorfes (Conisbrough) nennen genau solche Tätigkeiten: Weben, Schmieden, Zimmern, bezahlte Hebammen und Heiler. Der Historiker Christopher Dyer beschreibt Dorfschmiede, die die Pflugeisen pflegten und Holzkohle für ihre Esse brennen durften, und Bauern, die nebenbei im Wald Holzkohle herstellten.</p>'+
 '<p><b>Ehrlich dazu:</b> „Eine Rolle pro Bedürfnis“ ist eine Vereinfachung für das Spiel. Im echten Dorf waren fast alle zugleich Bauern, viele Arbeiten waren Nebenerwerb, und vieles machte jeder Haushalt selbst, etwa Wasser holen, Holz sammeln oder spinnen. Am dünnsten belegt sind zwei Rollen. Einen eigenen Beruf „Brunnenbauer“ findet man in den Dorfquellen kaum, wir brauchen ihn, damit Wasser ein eigenes Gesicht bekommt. Holzkohle brannten Waldbauern oft nebenbei, als Vollzeitberuf im Dorf ist der Köhler eher die Ausnahme.</p>',
 quellen:'<p><b>Bedürfnis-Modelle</b></p><ul>'+
 '<li>Maslow, A. H. (1943): A Theory of Human Motivation. <i>Psychological Review</i> 50, 370–396. <a href="https://psychclassics.yorku.ca/Maslow/motivation.htm">Volltext</a></li>'+
 '<li>Max-Neef, M. (1991/1992): Development and human needs (Matrix der Bedürfnisse, Tab. 7.1). <a href="https://attachments.kaanu.org/files/development,%20human%20needs%20&amp;%20satisfiers%201992%20Max-Neef.pdf">PDF</a> · <a href="https://en.wikipedia.org/wiki/Manfred_Max-Neef%27s_Fundamental_human_needs">Überblick</a></li></ul>'+

 '<li>Dyer, C. (2002/2003): <i>Making a Living in the Middle Ages. The People of Britain 850–1520</i>. Yale University Press. <a href="https://yalebooks.yale.edu/book/9780300101911/making-a-living-in-the-middle-ages/">Verlagsseite</a> · <a href="https://doi.org/10.12987/9780300167078">DOI</a> (Übersichtswerk, ohne Seitenangabe)</li>'+

/* Ein Tag im Dorf v5 (model unchanged since v4 except share()/need()) – REINES MODELL (kein DOM, keine Texte für die Oberfläche).
   Grundlage: v3 src/app.js (geprüft). Alle Werte sind Spielannahmen des Dorfmodells.

var MODEL=(function(){
"use strict";
/* v3-Preistabelle unverändert: Preise [Mittag, nach Runde 0, nach Runde 1, nach Runde 2, nach Runde 3] bei +700 */
var G={
 brot:{n:"Brot",by:"bauer",p:[40,40,43,44,45]},
 flachs:{n:"Flachs",by:"bauer",p:[40,40,40,40,43]},
 wasser:{n:"Wasser",by:"brunnenbauer",p:[20,20,21,22,23]},
 balken:{n:"Balken",by:"zimmermann",p:[120,130,130,132,132]},
 bauholz:{n:"Bauholz",by:"koehler",p:[60,60,63,63,63]},
 tuch:{n:"Tuch",by:"weber",p:[60,60,60,64,66]},
 brennholz:{n:"Brennholz",by:"koehler",p:[30,32,33,34,35]},
 holzkohle:{n:"Holzkohle",by:"koehler",p:[40,40,44,44,44]},
 salbe:{n:"Salbe",by:"heilerin",p:[48,48,48,48,51]},
 axt:{n:"Axt/Eisen",by:"schmied",p:[240,250,254,258,258]}
};
var ORDER=["brot","flachs","wasser","balken","bauholz","tuch","brennholz","holzkohle","salbe","axt"];
/* EINE Korb-Regel (v3): 2 Brot, 2 Wasser, 1 Brennholz, ohne eigene Ware, + Werkstoff; gekauft in der Runde nach dem Münz-Eingang */
var GRUND=[["brot",2],["wasser",2],["brennholz",1]];
var R={
 bauer:{n:"Bauer",recv:1,sales:[["brot",5,1],["flachs",1,1]],werk:[]},
 brunnenbauer:{n:"Brunnenbauer",recv:1,sales:[["wasser",12,1]],werk:[]},
 zimmermann:{n:"Zimmermann",recv:0,sales:[["balken",2,0]],werk:["bauholz"]},
 weber:{n:"Weber",recv:2,sales:[["tuch",2,2],["tuch",2,3]],werk:[]},
 koehler:{n:"Köhler",recv:0,sales:[["brennholz",4,0],["holzkohle",3,1]],werk:[]},
 heilerin:{n:"Heilerin",recv:3,sales:[["salbe",5,3]],werk:["tuch"]},
 schmied:{n:"Schmied",recv:0,sales:[["axt",1,0]],werk:["holzkohle"]}
};
var RORDER=["bauer","brunnenbauer","zimmermann","weber","koehler","heilerin","schmied"];
Object.keys(R).forEach(function(k){var r=R[k];r.buy=r.recv+1;
 r.basket=GRUND.filter(function(g){return G[g[0]].by!==k}).map(function(g){return [g[0],r.buy,g[1]]}).concat(r.werk.map(function(w){return [w,r.buy,1]}))});
var C={SPAR:360,COINS:7000,PERSONS:7,BESITZ:1000,HOURS:8,BASE:700};
/* Rats-Käufe in Runde 0 zu Mittagspreisen (v3-sales): nur für Stufe 700 im Modell festgelegt (Option A) */
var RAT_ORDERS_700=[["zimmermann","balken",2],["koehler","brennholz",4],["schmied","axt",1]];
var STEPS=[700,2800,7000];
/* Preisregel (Spielannahme, Educator geprüft): p(m) = p0 + (p_v3 − p0) · m/700. Bei 700 exakt v3. */
function price(g,stage,m){if(m===undefined)m=C.BASE;var p=G[g].p;return p[0]+(p[stage]-p[0])*m/C.BASE}
function isInt(x){return Math.abs(x-Math.round(x))<1e-9}
function calc(k,m){var r=R[k],c={};
 c.incM=r.sales.reduce(function(a,s){return a+s[1]*price(s[0],0,m)},0);
 c.incR=r.sales.reduce(function(a,s){return a+s[1]*price(s[0],s[2],m)},0);
 c.rateM=c.incM/C.HOURS;c.rateR=c.incR/C.HOURS;
 c.bM=r.basket.reduce(function(a,b){return a+b[2]*price(b[0],0,m)},0);
 c.bR=r.basket.reduce(function(a,b){return a+b[2]*price(b[0],b[1],m)},0);
 c.bE=r.basket.reduce(function(a,b){return a+b[2]*price(b[0],4,m)},0);
 c.minM=c.bM/c.rateM*60;c.minR=c.bR/c.rateR*60;c.minE=c.bE/c.rateR*60;
 c.dPct=(c.minR/c.minM-1)*100;c.incPct=(c.incR/c.incM-1)*100;c.bPct=(c.bR/c.bM-1)*100;
 c.rest=c.incM-c.bM;c.restR=c.incR-c.bR;return c}
function brote(m){return C.SPAR/price("brot",4,m)}           /* Erspartes am Abend in Brot */
function brote0(){return C.SPAR/price("brot",0)}             /* 9 */
function avgPct(m){return ORDER.reduce(function(a,g){return a+(price(g,4,m)/price(g,0,m)-1)*100},0)/ORDER.length}
function brotAvg(m){return C.SPAR/(price("brot",0)*(1+avgPct(m)/100))} /* "Waren im Schnitt" */
function rankByCost(m){return RORDER.slice().sort(function(a,b){return calc(a,m).dPct-calc(b,m).dPct})}
function ranking(m){return RORDER.slice().sort(function(a,b){return R[a].recv-R[b].recv||calc(a,m).dPct-calc(b,m).dPct})
 .map(function(k){var c=calc(k,m);return {k:k,recv:R[k].recv,dPct:c.dPct,minM:c.minM,minR:c.minR}})}
/* Nacht: bei 700 v3-Regel (1 von je 10 Münzen, 100 je Person); große Stufen: gleiche Kaufkraft m ÷ (7.000 + m), nur in Worten */
function night(m){if(m===C.BASE){var share=m/C.COINS,fromSpar=C.SPAR*share;
  return {rule:"v3",share:share,perPerson:C.BESITZ*share,total:C.BESITZ*share*C.PERSONS,fromSpar:fromSpar,brote:(C.SPAR-fromSpar)/price("brot",0)}}
 var s=m/(C.COINS+m);return {rule:"kaufkraft",share:s,brote:C.SPAR*(1-s)/price("brot",0)}}
/* Rats-Uhren: nur bei 700 definiert (Educator). Sonst null → keine Uhr. */
function ratClocks(m){if(m!==C.BASE)return null;var rate=30;
 var rows=RAT_ORDERS_700.map(function(o){var coins=o[2]*price(o[1],0);return {k:o[0],g:o[1],n:o[2],coins:coins,hours:coins/rate}});
 var spent=rows.reduce(function(a,r){return a+r.coins},0);
 return {rows:rows,spent:spent,hours:spent/rate,truhe:m-spent,rate:rate}}
/* v5 (spec 04 v1.1 §4.1; FE OK 2026-10-28, fachexperte-04-v5-bauauftrag.md B1):
   share of all money; precondition: amount of goods unchanged (village rule, „Warenmenge gleich“). Returns a fraction, not percent. */
function share(m,spar){if(m===undefined)m=0;if(spar===undefined)spar=C.SPAR;return spar/(C.COINS+m)}
/* coins needed for n loaves at the evening price after m new coins (default m = 700, intentional) */
function need(n,m){if(m===undefined)m=C.BASE;return n*price("brot",4,m)}
function mintPer10(m){return m/C.COINS*10}                  /* 1 / 4 / 10 neue auf je 10 */
/* (v5: scene „wdh“ dropped, spec §1.2; replay stays exported only for the v4.1 golden assertions)

 "K7-EM1":"{F:housingCredit.at} sind Kredite für Wohnungen und Häuser (Österreich; Euroraum {F:housingCredit.ea}).",
 "K7-EM1-L":"von allen Bankkrediten an Haushalte, {F:housingCredit.stand}. Quelle: EZB",
 "K7-EM2":"In {F:housingHist.n} stieg der Anteil der Kredite für Häuser und Wohnungen an allen Bankkrediten von {F:housingHist.from} ({F:housingHist.j1}) auf {F:housingHist.to} ({F:housingHist.j2}).",
 "K7-EM3":"{F:wagesAT.j1} stiegen die Löhne laut Kollektivvertrag um {F:wagesAT.lohn}, die Preise um {F:wagesAT.preis}. Erst {F:wagesAT.j2} und {F:wagesAT.j3} stiegen die Löhne stärker. Bis {F:wagesAT.j3} hatten sie die Preise fast wieder eingeholt.",
 "EXIT-K8":"Dein Sparziel ▸",
 /* K8 */
 "K8-T":"Dein Sparziel",
 "K8-00":"Ein Sparziel ist etwas, wofür du Münzen zurücklegst.",
 "K8-01a":"Dein Ziel: {n} Brote.","K8-01b":"Mittags reichen deine {spar} Münzen genau: {n} × {p0}.",
 "K8-01c":"Mit den neuen Münzen kostet ein Brot am Abend {p}.","K8-01d":"Dann brauchst du {need} Münzen.",
 "K8-01e":"Es fehlen {diff} Münzen. Das sind {h} Stunden mehr Arbeit.",
 "K8-01-K5a":"Ohne neue Münzen bliebe Brot bei {p0}, wie in der Nacht.","K8-01-K5b":"Dann würden deine {spar} Münzen für dein Ziel reichen.",
 "K8-01-B29":"So behält Geld seinen Wert: Du bekommst später gleich viel Brot dafür.",
 "K8-02a":"Auf dem Sparbuch bekommst du Zinsen.","K8-02b":"Steigen die Preise schneller als die Zinsen, dauert das Sparen länger.",
 "K8-02c":"Mit einem Kredit hast du das Ziel früher.","K8-02d":"Dafür zahlst du Zinsen.",
 "K8-02e":"Anlegen heißt: Geld in etwas stecken, dessen Wert wachsen oder schrumpfen kann.",
 "K8-02f":"Wer Geld anlegt, etwa in Teile von Firmen oder in eine Wohnung, kann steigende Preise langfristig oft ausgleichen.",
 "K8-02g":"Er trägt aber ein Risiko.","K8-02h":"Risiko heißt: Du kannst auch Geld verlieren.",
 "K8-03a":"Wenn Geld seinen Wert behält, erreicht man ein Sparziel leichter.","K8-03b":"So braucht man dafür seltener einen Kredit.",
 "K8-03-KB":"Neue Euro zu machen kostet fast keine Arbeit. Doch das kann die Preise treiben. Dann zahlen alle, deren Lohn erst später steigt, und alle, die sparen. Wenn Geld seinen Wert behält, erreicht man ein Sparziel leichter. So braucht man dafür seltener einen Kredit.",
 "K8-EM-SB-L":"Sparbuch, jederzeit abhebbar · nach Steuern",
 "K8-EM-SB1":"{F:sparbuch92.a}, die man {F:sparbuch92.b} auf ein Sparbuch legte, kauften {F:sparbuch92.c} trotz Zinsen nur noch so viel wie {F:sparbuch92.d} damals.",
 "K8-EM-SB2":"{F:sparbuch6700.a}, die man {F:sparbuch6700.b} auf ein Sparbuch legte, kauften {F:sparbuch6700.c} trotz Zinsen nur noch so viel wie {F:sparbuch6700.d} damals.",
 "K8-EM-SB3":"Von {F:sparbuch6700.b} bis {F:sparbuch6700.c} stiegen die Preise jedes Jahr stärker als die Zinsen.",
 "K8-EM-SB4":"Das sind Durchschnittszinsen. Einzelne Angebote lagen höher.",
 "K8-EM-SB-Q":"OeNB: täglich fällige Spareinlagen privater Haushalte, Durchschnittszinsen, nach Kapitalertragsteuer (KESt, {F:kest.n}); Statistik Austria: Verbraucherpreisindex. {F:sparbuch6700.zr} gerechnet mit Jahresdurchschnitten, {F:sparbuch92.zr} von Dezember zu Dezember.",
 "K8-EM3":"{F:vpi78.a} von {F:vpi78.b} kaufen {F:vpi78.c} nur noch so viel wie damals {F:vpi78.d}.",
 "K8-EM3-L":"Stand: {F:vpi78.stand}, VPI",
 "KASTEN-B-T":"Was man noch wissen sollte",
 "KASTEN-B1":"Geld, das seinen Wert behält: Auch damit gibt es Kredit, vor allem aus vorhandenem Ersparten, vermutlich knapper oder teurer. Ob Geld, das seinen Wert ganz behält, insgesamt besser ist, ist umstritten. Die meisten Zentralbanken wollen lieber leicht steigende Preise, etwa {F:preisziel.n} im Jahr. Ob man dann fairer an Kredit käme, weiß niemand sicher.",
 "KASTEN-B2":"Zinsen können den Verlust beim Sparen ganz oder teilweise ausgleichen, oft aber nicht (Sparbuch, jederzeit abhebbar: {F:sparbuch92.a} {F:sparbuch92.b} kauften {F:sparbuch92.c} trotz Zinsen nur noch so viel wie {F:sparbuch92.d} vorher, nach Steuern). Der Rahmen ist öffentlich und gesetzlich geregelt (Preisziel der Zentralbank: {F:preisziel.n}); über jede einzelne Menge neuen Geldes wird aber nicht abgestimmt.",
 "KASTEN-B2-Q":"Quelle: VPI von Statistik Austria und Zinssätze der OeNB, {F:sparbuch92.dz}.",
 "KASTEN-B3":"Entscheidend ist, ob die Zinsen mit den Preisen mithalten. Sind die Zinsen hoch genug, klappt Sparen auch bei steigenden Preisen.",
 "KASTEN-B4":"Steigen die Preise schneller als die Zinsen, wird eine Schuld mit der Zeit weniger wert. Davon haben Schuldner einen Vorteil.",
 "KASTEN-B5":"In echt bekommt nicht jeder gleich leicht Kredit: Wer schon etwas als Pfand hat, etwa ein Haus oder Erspartes, bekommt ihn leichter. Ein großer Teil geht in Häuser und Wohnungen.",
 "EXIT-K9":"Ein fester Plan",
 /* K9 */
 "K9-T":"Wer bestimmt, wie viel neues Geld entsteht?",
 "K9-01":"Heute bestimmen Zentralbanken und Banken laufend mit, wie viel.",
 "K9-02a":"Es gibt auch Geld mit einem festen, öffentlichen Plan.","K9-02b":"Den Plan kann jeder nachlesen, aber niemand allein ändern.",
 "K9-02c":"Bitcoin ist eine Art Geld im Internet. Es folgt einem festen, öffentlichen Plan.",
 "K9-02d":"Ein fester Plan heißt aber nicht fester Wert.",
 "K9-02-AT":"Feste Menge ▸","K9-02-A":"Feste Menge: Wie viel es höchstens gibt, legt der Plan vorher fest.",
 "K9-03a":"Auch dort bekommen einige das neue Geld zuerst.","K9-03b":"Zuerst bekommen sie die, die für Bitcoin rechnen, nach festem Plan.",
 "KA3-R1":"Dieselbe Anzeige für Bitcoin. Angenommen, du hast Bitcoin und gibst nichts aus.",
 "KA3-R2":"Bei Bitcoin kommen nur noch wenige neue dazu, nach festem Plan.",
 "KA3-F":"Was du dafür kaufen kannst: schwankt stark",
 "B57":"Dein Anteil bleibt fast gleich. Was du dafür kaufen kannst, schwankt aber stark. Ein gleicher Anteil heißt nicht gleicher Wert.",
 "KA3-BTN":"Ein Jahr später, nach Plan",
 "D-1":"{F:btcSupply.stand} gibt es {F:btcSupply.n} Bitcoin. Pro Jahr kommen {F:btcPerYear.n} dazu, {F:btcRatePct.lt}. Ab etwa {F:halvingBlock.jahr} wird es nur noch die Hälfte sein. Insgesamt wird es höchstens {F:btcCap.n} geben.",
 "D-1-SRC":"Quelle: Protokollregeln von Bitcoin; Nakamoto ({F:nakamoto.jahr}), Abschnitt {F:nakamoto.abschnitt}.",
 "K9-04":"Der Preis kann auch über Monate und Jahre fallen.",
 "K9-05a":"Eine Bitcoin-Zahlung lässt sich nicht zurückholen.",
 "K9-05b":"Bitcoin kauft man oft bei einer Firma im Internet, einer Börse.",
 "K9-05c":"Ein Bitcoin-Guthaben bei einer Börse ist nur ein Versprechen. Geht die Börse pleite, kann es weg sein (etwa die Börse FTX, {F:ftx.jahr}).",
 "K9-05d":"Man kann Bitcoin auch selbst aufbewahren. Dafür braucht man einen geheimen Schlüssel, eine Art Passwort. Wer ihn verliert, verliert das Geld.",
 "K9-05e":"Manche Bitcoin kann niemand mehr ausgeben, weil der Schlüssel verloren ist.","K9-05f":"Wie viele, weiß niemand genau.",
 "K9-05g":"Bitcoin braucht viel Strom.",
 "K9-05h":"Geld mit festem Plan hieße wohl weniger Kredit, und Krisen könnten härter sein. Fachleute streiten darüber.",
 "K9-06":"Das hier ist keine Empfehlung, Bitcoin oder etwas anderes zu kaufen.",
 /* Allgemein */
 "G-wie":"Wie gerechnet? ▸","G-mehr":"Erklär mehr","G-back":"‹ Zurück"
};

/* ===== shared bar „Dein Anteil am ganzen Geld“ (04 §3, §7) =====
   Geometry in fractions of the container width. KA-1: true model proportions (cause step 7.000 : 7.000+m, start drawn at half width).
   KA-2/KA-3: step = rate of the bar width; rate read from FACTS (m3Avg, btcRatePct), never a literal. Own piece drawn larger (OWN). */
var OWN=0.2;
function rateOf(kind){return kind==="ka2"?FACTS.m3Avg.value/100:FACTS.btcRatePct.value/100}
function barGeom(kind,m){
 if(kind==="ka1"){var s0=M.share(0),g=(C.COINS+m)/C.COINS;
  return [{total:1,own:s0},{total:0.5,own:0.5*s0},{total:0.5*g,own:0.5*s0},{total:1,own:M.share(m)}]}
 if(kind==="gs"){var s=M.share(0);return [{total:1,own:s},{total:0.5,own:0.5*s},{total:0.55,own:0.55*s},{total:1,own:s}]}
 var r=rateOf(kind),base=1/(1+r);
 return [{total:base,own:OWN*base},{total:base,own:OWN*base},{total:base*(1+r),own:OWN*base},{total:base,own:OWN*base/(1+r)}]}
function barHtml(id,kind,i){var g=barGeom(kind==="ka1"?"ka1":kind,kind==="ka1"?0:0)[0];
 return '<div class="bar5" id="'+id+'" data-kind="'+kind+'" role="img" aria-label="'+t("BAR-T")+'"><div class="all" style="width:'+(g.total*100)+'%"><div class="own" style="width:'+(g.own/g.total*100)+'%"></div></div></div>'}
var BT=[];
function applyGeom(el,g,anim){var a=el.querySelector(".all"),o=el.querySelector(".own");el.classList.toggle("anim",!!anim);
 a.style.width=(g.total*100)+"%";o.style.width=(g.own/g.total*100)+"%";
 var rec=JSON.parse(el.dataset.geom||"[]");rec.push({total:g.total,own:g.own,W:el.clientWidth});el.dataset.geom=JSON.stringify(rec)}
/* runs cause → share → result; cb(step) shows the step's text; reduced motion: end state at once */
function runBar(id,kind,m,cb){BT.forEach(clearTimeout);BT=[];var el=$("#"+id);if(!el)return;var G=barGeom(kind,m);el.dataset.geom="[]";
 if(RM){applyGeom(el,G[3],false);cb(3);return}
 applyGeom(el,G[1],false);cb(1);
 BT.push(setTimeout(function(){applyGeom(el,G[2],true)},60));
 BT.push(setTimeout(function(){applyGeom(el,G[3],true);cb(2)},800));
 BT.push(setTimeout(function(){cb(3)},1600))}
